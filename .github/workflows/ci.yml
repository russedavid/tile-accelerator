name: CPU compiler and simulator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,iree]'
      - run: python -m pytest -q
      - run: cmake -S . -B build -DTILE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: TILE_SIM=build/tile-sim python -m pytest -q tests/test_execution.py tests/test_analysis.py
